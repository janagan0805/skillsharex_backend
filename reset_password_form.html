<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #218838; }
        .message { margin-top: 10px; font-size: 14px; text-align: center; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Reset Password</h2>
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" placeholder="Enter new password" required>
        <button onclick="resetPassword()">Change Password</button>
        <div id="message" class="message"></div>
    </div>

    <script>
        function resetPassword() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const newPassword = document.getElementById('new_password').value;
            const messageDiv = document.getElementById('message');

            if (!token) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Invalid or missing token.';
                return;
            }

            if (!newPassword) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Please enter a new password.';
                return;
            }

            fetch('api/auth/reset_password.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ token: token, new_password: newPassword })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    // Start Carousel Slide 1: Success State
                    document.querySelector('.container h2').textContent = 'Success';
                    document.getElementById('new_password').style.display = 'none';
                    document.querySelector('button').style.display = 'none';
                    document.querySelector('label').style.display = 'none';
                    
                    messageDiv.className = 'message success';
                    messageDiv.innerHTML = data.message + '<br><br>The password reset link is now invalid.<br>You can safely close this page.';
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = data.message;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                messageDiv.className = 'message error';
                messageDiv.textContent = 'An error occurred. Please try again.';
            });
        }
    </script>

</body>
</html>
